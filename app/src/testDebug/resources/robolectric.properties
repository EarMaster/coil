# Shared configuration for every Robolectric test in this module.
#
# The Hilt test application, so the graph exists and `hiltViewModel()` resolves inside a
# captured `CoilApp`. Set here rather than per class because every test needs it.
application=dagger.hilt.android.testing.HiltTestApplication
#
# sdk 36 matches targetSdk, so the screenshots show the platform the app actually asks for.
sdk=36
#
# NATIVE graphics is what makes a screenshot a screenshot: without it Robolectric draws
# nothing and every golden would be a blank bitmap.
graphicsMode=NATIVE
#
# A mid-size phone in portrait — the same dimensions as Roborazzi's own "MediumPhone" device,
# spelled out rather than referenced so a golden's size cannot change under us when a library
# updates its idea of a current phone. Portrait is implied by the width being under the height.
qualifiers=w411dp-h914dp-normal-long-notround-any-420dpi-keyshidden-nonav
