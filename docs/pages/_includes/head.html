<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>{% if page.url == '/' %}{{ site.page_title }}{% else %}{{ page.title }} — {{ site.app_name }}{% endif %}</title>
	<meta name="description" content="{{ site.app_description }}">

	<link rel="icon" type="image/svg+xml" href="{{ site.app_icon | relative_url }}">
	<link rel="canonical" href="{{ page.url | absolute_url }}">

	<meta property="og:type" content="website">
	<meta property="og:title" content="{% if page.url == '/' %}{{ site.page_title }}{% else %}{{ page.title }} — {{ site.app_name }}{% endif %}">
	<meta property="og:description" content="{{ site.app_description }}">
	<meta property="og:url" content="{{ page.url | absolute_url }}">
	{% if site.screenshots %}
		<meta property="og:image" content="{{ site.screenshots.first.image | absolute_url }}">
	{% endif %}
	<meta name="twitter:card" content="summary_large_image">

	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css" integrity="sha384-UHRtZLI+pbxtHCWp1t77Bi1L4ZtiqrqD80Kn4Z8NTSRyMA2Fd33n5dQ8lWUE00s/" crossorigin="anonymous">
	<link rel="stylesheet" href="{{ '/main.css' | relative_url }}">
</head>
