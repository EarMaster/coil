<!--
  Coil logo mark, inverted for use on the green header.

  The standard mark (assets/coil-mark.svg) is a Coil Deep card with the coil knocked out in
  white, which is what the hero icon and the favicon use. On the green cover that card has
  almost no contrast against its background, so this variant flips it: white card, green coil.

  Only the header on the landing page uses this. The privacy page header sits on white and
  uses the standard mark.
-->

<!--
  The viewBox is cropped to the card plus 4px of padding, rather than the standard mark's
  square 0 0 96 96. Without the plate behind it, a square box would leave 12px of dead space
  above and below the card and make the logo look undersized next to the wordmark.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 20 84 56" width="84" height="56" role="img" aria-label="Coil">
  <title>Coil</title>

  <rect x="10" y="24" width="76" height="48" rx="11" fill="#FFFFFF"/>
  <path d="M22 60 V36 H74 V60 H30 V44 H66 V52 H40"
        fill="none" stroke="#0F6B5C" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
