# Sized to coexist with an open IDE: the Gradle daemon, the Kotlin daemon below and lint's
# workers all want memory at once, and asking for more than the machine has free makes the
# daemon disappear mid-build rather than fail cleanly.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
ksp.incremental=true

# The Kotlin compile daemon gets no heap setting of its own and failed to start behind a
# larger Gradle daemon, silently falling back to slower in-process compilation.
kotlin.daemon.jvmargs=-Xmx1g

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
